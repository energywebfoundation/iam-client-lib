name: Lint source code

on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      - name: Install modules
        run: npm ci --legacy-peer-deps
      - name: Run ESLint
        run: npx eslint --output-file eslint_report.json --format json src/** e2e/** scripts/**
      - name: Annotate Code Linting Results
        uses: ataylorme/eslint-annotate-action@a1bf7cb320a18aa53cb848a267ce9b7417221526 # 1.2.0
        if: always()
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          report-json: 'eslint_report.json'
      - name: Run Prettier
        run: npx prettier --check src/**/*.*s e2e/**/*.*s scripts/**/*.*s
