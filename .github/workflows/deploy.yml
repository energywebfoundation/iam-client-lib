name: Deploy

on:
  push:
    branches: ['develop', 'master']
  pull_request:

jobs:
  cancel-previous:
    name: 'Cancel Previous Runs'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: styfle/cancel-workflow-action@0.12.0
        with:
          access_token: ${{ github.token }}

  deploy:
    runs-on: ubuntu-latest
    needs: cancel-previous
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/

      - name: Configure Git
        run: |
          git config --global user.email ${{ secrets.GH_EMAIL }}
          git config --global user.name ${{ secrets.GH_USER }}
          git remote set-url origin "https://${{ github.token }}@github.com/energywebfoundation/iam-client-lib.git" > /dev/null 2>&1
          git reset --hard
          git fetch -u origin master:master

      - name: Set npm credentials
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> $HOME/.npmrc

      - name: Install package
        run: npm ci

      - name: Build package
        run: npm run build

      # Enabled for develop. master stays skipped until IPFS setup is fixed.
      # See https://energyweb.atlassian.net/browse/SWTCH-3073
      # - name: Npm Run Test
      #   if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
      #   run: npm run test

      - name: Deploy on develop branch
        if: github.ref == 'refs/heads/fix/deploy'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      - name: Deploy on master branch
        if: github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      - name: Merge master into develop
        if: github.ref == 'refs/heads/master'
        run: |
          git checkout develop
          sudo chown $(id -u) .git/logs/refs/heads/develop
          git fetch
          git merge origin/master
          git push origin develop
