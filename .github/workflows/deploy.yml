name: Deploy

on:
  push:
    branches: ["feat/claim-pagination", "master"]
  pull_request:

jobs:
  cancel-previous:
    name: "Cancel Previous Runs"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: styfle/cancel-workflow-action@0.12.0
        with:
          access_token: ${{ github.token }}

  deploy:
    runs-on: ubuntu-latest
    needs: cancel-previous
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
          # token: ${{ secrets.SECRET_NAME }}
      - uses: actions/setup-node@v2-beta
        with:
          node-version: "18"
          registry-url: https://registry.npmjs.org/

      - name: Configure Git
        run: |
          git config --global user.email ${{ secrets.GH_EMAIL }}
          git config --global user.name ${{ secrets.GH_USER }}
          git remote set-url origin "https://${{ github.token }}@github.com/energywebfoundation/iam-client-lib.git" > /dev/null 2>&1
          git reset --hard
          git fetch -u origin master:master

      - name: Set npm credentials
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> $HOME/.npmrc

      - name: Install package
        run: npm ci

      - name: Build package
        run: npm run build

      # Skipped, until fix issue with setting up IPFS
      # See https://energyweb.atlassian.net/browse/SWTCH-3073
      # - name: Npm Run Test
      #   run: npm run test

      - name: Publish to npm
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/claim-pagination'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.SECRET_NAME }}
          RUN_NUMBER: ${{ github.run_number }}
        run: npm version prerelease --preid=dev.$RUN_NUMBER --no-git-tag-version --exact && npm publish --tag=canary --access=public

      - name: Deploy on master branch
        if: github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      - name: Merge master into develop
        if: github.ref == 'refs/heads/master'
        run: |
          git checkout develop
          sudo chown $(id -u) .git/logs/refs/heads/develop
          git fetch
          git merge origin/master
          git push origin develop
